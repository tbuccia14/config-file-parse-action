[project]
name = "config-file-parse-action"
version = "1.0.0"
description = "GitHub Action to parse JSON/YAML config files and export key-value pairs in GITHUB_ENV"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "coverage-badge",
    # coverage-badge depends on the deprecated pkg_resources module, removed in
    # setuptools>=81. Keep this ceiling until coverage-badge drops the dependency
    # (see .github/dependabot.yml, which also ignores updates past this range).
    "setuptools<81",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
