name: Bug report
description: Report a problem with the action
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Workflow / config file used
      description: Paste the relevant `uses:` step and the JSON/YAML config file being parsed.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell

  - type: input
    id: version
    attributes:
      label: Action version
      placeholder: e.g. v1.2.3
    validations:
      required: true
